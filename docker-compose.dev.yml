version: '3'

services:
  # База данных
  mongo:
    image: mongo:latest
    container_name: kpius-mongodb-dev
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=kpiusdb
    restart: unless-stopped
    networks:
      - app-network

  # FastAPI сервер в режиме разработки с автоперезагрузкой
  api:
    build:
      context: ./fastapi-server
      dockerfile: Dockerfile
    container_name: kpius-api-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 5005 --reload
    ports:
      - "5005:5005"
    volumes:
      - ./fastapi-server:/app
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - DATABASE_NAME=kpiusdb
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - app-network

  # Клиент React в режиме разработки
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kpius-client-dev
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:5005/api
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge 