version: '3.8'

services:
  # База данных
  mongodb:
    image: mongo:6.0
    container_name: kpius-mongodb-dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=kpiusdb
    restart: unless-stopped
    networks:
      - kpius-network

  # Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: kpius-rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - kpius-network

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: kpius-api-gateway-dev
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - ATTENDANCE_SERVICE_URL=http://attendance-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:8004
      - REPORTING_SERVICE_URL=http://reporting-service:8005
      - JWT_SECRET=your-secret-key
    volumes:
      - ./services/api-gateway:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - auth-service
      - user-service
      - attendance-service
      - notification-service
      - reporting-service
    restart: unless-stopped
    networks:
      - kpius-network

  # Auth Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: kpius-auth-service-dev
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=kpiusdb
      - JWT_SECRET=your-secret-key
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    volumes:
      - ./services/auth-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - kpius-network

  # User Service
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: kpius-user-service-dev
    ports:
      - "8002:8002"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=kpiusdb
      - AUTH_SERVICE_URL=http://auth-service:8001
    volumes:
      - ./services/user-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    depends_on:
      - mongodb
      - auth-service
    restart: unless-stopped
    networks:
      - kpius-network

  # Attendance Service
  attendance-service:
    build:
      context: ./services/attendance-service
      dockerfile: Dockerfile
    container_name: kpius-attendance-service-dev
    ports:
      - "8003:8003"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=kpiusdb
      - AUTH_SERVICE_URL=http://auth-service:8001
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - ./services/attendance-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --reload
    depends_on:
      - mongodb
      - rabbitmq
      - auth-service
    restart: unless-stopped
    networks:
      - kpius-network

  # Notification Service
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: kpius-notification-service-dev
    ports:
      - "8004:8004"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=kpiusdb
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - USER_SERVICE_URL=http://user-service:8002
    volumes:
      - ./services/notification-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8004 --reload
    depends_on:
      - mongodb
      - rabbitmq
      - user-service
    restart: unless-stopped
    networks:
      - kpius-network

  # Reporting Service
  reporting-service:
    build:
      context: ./services/reporting-service
      dockerfile: Dockerfile
    container_name: kpius-reporting-service-dev
    ports:
      - "8005:8005"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=kpiusdb
      - ATTENDANCE_SERVICE_URL=http://attendance-service:8003
      - USER_SERVICE_URL=http://user-service:8002
    volumes:
      - ./services/reporting-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8005 --reload
    depends_on:
      - mongodb
      - attendance-service
      - user-service
    restart: unless-stopped
    networks:
      - kpius-network

  # Клиент React
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kpius-client-dev
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm start
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - kpius-network

volumes:
  mongodb_data:
  rabbitmq_data:

networks:
  kpius-network:
    driver: bridge 